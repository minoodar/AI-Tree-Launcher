<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Tab</title>

<!-- باید همیشه اولین چیز در <head> بماند -->
<script src="void-tab-router.js"></script>

<style>
    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }

    body {
        position: relative;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
    }

    #starfield {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
    }

    .space-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0, 0, 0, 0.08) 45%,
                rgba(0, 0, 0, 0.48) 100%
            );
    }

    @media (prefers-reduced-motion: reduce) {
        #starfield { animation: none; }
    }

    /* ---- Top-right quickbar (minimal) ---- */
    #ai-ntp-quickbar {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 50;
        display: flex;
        gap: 6px;
        padding: 6px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        opacity: 0.28;
        transition: opacity 0.25s ease, background 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
    }
    #ai-ntp-quickbar:hover,
    #ai-ntp-quickbar:focus-within {
        opacity: 1;
        background: rgba(20, 22, 30, 0.55);
        border-color: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    #ai-ntp-quickbar a,
    #ai-ntp-quickbar button {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #E5E7EB;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    #ai-ntp-quickbar a:hover,
    #ai-ntp-quickbar button:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: scale(1.14);
    }

    /* ---- Center stage: search + shortcuts + topsites ---- */
    #ai-void-stage {
        position: fixed;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        z-index: 40;
        width: min(640px, calc(100vw - 32px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        pointer-events: none;
    }
    #ai-void-stage > * { pointer-events: auto; }

    /* Multi-engine search */
    #ai-void-search {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .ai-void-search-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
        user-select: none;
    }
    .ai-void-search-nav {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        color: rgba(226,232,255,0.75);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        display: grid;
        place-items: center;
        transition: background .15s ease, color .15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-void-search-nav:hover {
        background: rgba(255,255,255,0.12);
        color: #fff;
        transform: scale(1.14);
    }
    #ai-void-search-brand {
        --engine-accent: #8ab4f8;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(12, 16, 32, 0.45);
        border: 1px solid rgba(165, 180, 252, 0.18);
        cursor: pointer;
        transition: border-color .2s ease, box-shadow .2s ease;
    }
    #ai-void-search-brand:hover {
        border-color: rgba(165, 180, 252, 0.35);
        box-shadow: 0 0 0 1px rgba(165,180,252,0.08), 0 8px 24px rgba(0,0,0,0.25);
    }
    .ai-void-search-brand-pulse { animation: aiVoidBrandPulse .35s ease; }
    @keyframes aiVoidBrandPulse {
        0% { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
    .ai-void-search-brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0%, var(--engine-accent) 45%, transparent 70%);
        box-shadow: 0 0 12px color-mix(in srgb, var(--engine-accent) 55%, transparent);
        flex: 0 0 22px;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    #ai-void-search-brand:hover .ai-void-search-brand-mark {
        transform: scale(1.16);
    }
    #ai-void-search-brand-name {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #F1F5FF;
        text-shadow: 0 1px 12px rgba(0,0,0,0.45);
    }
    .ai-void-search-box {
        width: 100%;
        max-width: 584px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 16px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
            0 1px 2px rgba(0,0,0,0.08),
            0 8px 28px rgba(0,0,0,0.28),
            0 0 0 1px rgba(165,180,252,0.08);
        transition: box-shadow .2s ease;
    }
    .ai-void-search-box:focus-within {
        box-shadow:
            0 1px 2px rgba(0,0,0,0.06),
            0 12px 36px rgba(0,0,0,0.35),
            0 0 0 2px color-mix(in srgb, var(--engine-accent, #8ab4f8) 55%, transparent);
    }
    .ai-void-search-icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        opacity: 0.45;
        color: #3c4043;
    }
    #ai-void-search-input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #202124;
        padding: 10px 4px;
    }
    #ai-void-search-input::placeholder { color: #80868b; }
    #ai-void-search-go {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: #1a2338;
        color: #e8eeff;
        font-size: 18px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease, transform .12s ease;
    }
    #ai-void-search-go:hover { background: #2a3654; transform: scale(1.04); }
    #ai-void-search-dots {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        min-height: 12px;
    }
    .ai-void-search-dot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(226, 232, 255, 0.28);
        cursor: pointer;
        transition: transform .15s ease, background .15s ease;
    }
    .ai-void-search-dot.is-active {
        background: var(--engine-accent, #a5b4fc);
        transform: scale(1.35);
        box-shadow: 0 0 8px color-mix(in srgb, var(--engine-accent, #a5b4fc) 60%, transparent);
    }

    /* Gmail / account shortcuts under search — deliberately small and quiet,
       same visual weight as the quickbar / search-engine brand mark, not a
       loud app-launcher grid. Color lives in the glyph, not in a filled tile. */
    #ai-void-apps {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px 6px;
        padding: 2px 0 0;
        opacity: 0.62;
        transition: opacity .25s ease;
    }
    #ai-void-apps:hover,
    #ai-void-apps:focus-within {
        opacity: 1;
    }
    .ai-void-app {
        width: 46px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 2px 4px;
        border-radius: 12px;
        text-decoration: none;
        color: #E5E7EB;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .ai-void-app:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.07);
        transform: translateY(-1px);
    }
    .ai-void-app-icon {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: rgba(226, 232, 255, 0.82);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-void-app:hover .ai-void-app-icon,
    .ai-void-app:focus-within .ai-void-app-icon {
        transform: scale(1.16);
    }
    .ai-void-app-icon img,
    .ai-void-app-icon svg {
        width: 14px;
        height: 14px;
        object-fit: contain;
    }
    /* Brand identity is a hint of color in the glyph only — no filled blocks */
    .ai-void-app-icon.is-mail { color: #f28b82; }
    .ai-void-app-icon.is-drive { color: #7ecb92; }
    .ai-void-app-icon.is-cal { color: #8ab4f8; }
    .ai-void-app-icon.is-photos { color: #fdd663; }
    .ai-void-app-icon.is-custom { color: rgba(226, 232, 255, 0.82); }
    .ai-void-app-label {
        font-size: 9.5px;
        color: rgba(226, 232, 255, 0.6);
        max-width: 50px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }
    .ai-void-app-add {
        opacity: 0.55;
    }
    .ai-void-app-add:hover { opacity: 1; }
    .ai-void-app-add .ai-void-app-icon {
        background: rgba(255,255,255,0.04);
        border-style: dashed;
        color: rgba(226,232,255,0.6);
        font-size: 15px;
        font-weight: 400;
    }
    .ai-void-app { position: relative; }
    .ai-void-app-edit {
        position: absolute;
        top: 1px;
        inset-inline-end: 1px;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 6px;
        background: rgba(10, 14, 28, 0.82);
        color: #fff;
        font-size: 9px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: translateY(-2px);
        transition: opacity .15s ease, transform .15s ease, background .15s ease;
    }
    .ai-void-app:hover .ai-void-app-edit,
    .ai-void-app:focus-within .ai-void-app-edit {
        opacity: 1;
        transform: translateY(0);
    }
    .ai-void-app-edit:hover { background: rgba(79, 70, 229, 0.92); }
    .ai-void-app-add .ai-void-app-edit { display: none; }

    /* Account indicator avatar */
    .ai-ntp-avatar {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(145deg, #7c6af2, #4f46e5);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    }

    /* Most visited — under shortcuts. Same quiet scale/behavior as #ai-void-apps
       so the two rows read as one calm system, not two different weights. */
    #ai-ntp-topsites {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        max-width: 560px;
        opacity: 0.62;
        transition: opacity 0.25s ease;
    }
    #ai-ntp-topsites:hover,
    #ai-ntp-topsites:focus-within {
        opacity: 1;
    }
    #ai-ntp-topsites.hidden { display: none; }
    .ai-ts-tile {
        width: 58px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        padding: 6px 2px 4px;
        border-radius: 12px;
        transition: background 0.15s ease;
    }
    .ai-ts-tile:hover { background: rgba(255, 255, 255, 0.05); }
    .ai-ts-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-ts-tile:hover .ai-ts-icon,
    .ai-ts-tile-wrap:hover .ai-ts-icon,
    .ai-ts-tile-wrap:focus-within .ai-ts-icon {
        transform: scale(1.16);
    }
    .ai-ts-icon img { width: 16px; height: 16px; }
    .ai-ts-label {
        font-size: 9.5px;
        color: rgba(226, 232, 255, 0.7);
        max-width: 58px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
    }
    .ai-ts-tile-wrap { position: relative; }
    .ai-ts-controls {
        position: absolute;
        top: 2px;
        inset-inline-end: 2px;
        display: flex;
        gap: 2px;
        opacity: 0;
        transform: translateY(-2px);
        transition: opacity .15s ease, transform .15s ease;
    }
    .ai-ts-tile-wrap:hover .ai-ts-controls,
    .ai-ts-tile-wrap:focus-within .ai-ts-controls {
        opacity: 1;
        transform: translateY(0);
    }
    .ai-ts-ctrl-btn {
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 6px;
        background: rgba(10, 14, 28, 0.8);
        color: #E5E7EB;
        font-size: 10px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease;
    }
    .ai-ts-ctrl-btn:hover { background: rgba(79, 70, 229, 0.9); }
    .ai-ts-ctrl-remove:hover { background: rgba(239, 68, 68, 0.9); }
    .ai-ts-tile-add {
        border: 1px dashed rgba(255, 255, 255, 0.18);
        background: transparent;
        font: inherit;
        color: inherit;
        opacity: 0.6;
    }
    .ai-ts-tile-add:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .ai-ts-icon-add {
        font-size: 15px;
        font-weight: 400;
        color: rgba(226, 232, 255, 0.7);
        background: rgba(255, 255, 255, 0.04);
        border-style: dashed;
    }

    /* Menu top-left */
    #ai-ntp-menu {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 51;
    }
    #ai-ntp-menu-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.03);
        color: #E5E7EB;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.28;
        transition: opacity 0.25s ease, background 0.2s ease;
    }
    #ai-ntp-menu-btn:hover,
    #ai-ntp-menu.open #ai-ntp-menu-btn {
        opacity: 1;
        background: rgba(255, 255, 255, 0.1);
    }
    #ai-ntp-menu-panel {
        position: absolute;
        top: 38px;
        left: 0;
        min-width: 220px;
        background: rgba(20, 22, 30, 0.9);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateY(-6px) scaleY(0.96);
        transform-origin: top left;
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease;
    }
    #ai-ntp-menu.open #ai-ntp-menu-panel {
        opacity: 1;
        transform: translateY(0) scaleY(1);
        pointer-events: auto;
    }
    .ai-ntp-menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        background: none;
        border: none;
        color: #E5E7EB;
        font-size: 12.5px;
        font-family: inherit;
        text-align: inherit;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .ai-ntp-menu-item:hover { background: rgba(255, 255, 255, 0.08); }
    .ai-ntp-menu-item .ai-ntp-menu-check {
        font-size: 11px;
        color: #6EE7B7;
        opacity: 0;
    }
    .ai-ntp-menu-item[data-on="1"] .ai-ntp-menu-check { opacity: 1; }

    body.ai-focus-mode #ai-ntp-quickbar,
    body.ai-focus-mode #ai-ntp-topsites,
    body.ai-focus-mode #ai-void-apps,
    body.ai-focus-mode #ai-orbit-root {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.3s ease;
    }
    body.ai-focus-mode #ai-void-search {
        opacity: 0.35;
    }

    /* Todo dock */
    #ai-void-todo-dock {
        position: fixed; top: 22%; z-index: 2147483647;
        display: block !important; visibility: visible !important; opacity: 1 !important;
        pointer-events: auto !important;
        width: min(280px, calc(100vw - 32px));
        max-height: min(56vh, 430px);
        color: #EEF2FF;
        background: rgba(10, 14, 28, .7);
        border: 1px solid rgba(165, 180, 252, .28);
        border-radius: 14px;
        backdrop-filter: blur(18px) saturate(1.15);
        -webkit-backdrop-filter: blur(18px) saturate(1.15);
        box-shadow: 0 15px 42px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06);
        overflow: hidden;
        transition: box-shadow .2s ease, opacity .2s ease, max-height .28s cubic-bezier(.16,1,.3,1);
    }
    #ai-void-todo-dock[data-side="right"] { right: 16px; }
    #ai-void-todo-dock[data-side="left"] { left: 16px; }
    #ai-void-todo-dock:hover { box-shadow: 0 18px 48px rgba(0,0,0,.48), 0 0 0 1px rgba(165,180,252,.13); }
    #ai-void-todo-dock.is-collapsed { max-height: 42px; }
    #ai-void-todo-dock.is-collapsed .ai-void-todo-list { display: none; }
    #ai-void-todo-dock.is-collapsed .ai-void-todo-head { border-bottom-color: transparent; }
    .ai-void-todo-head {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px solid rgba(255,255,255,.07);
        cursor: pointer; user-select: none;
    }
    .ai-void-todo-head:active { cursor: grabbing; }
    .ai-void-todo-title { font-size: 12px; font-weight: 800; letter-spacing: .02em; }
    .ai-void-todo-count { margin-inline-start: auto; font-size: 10px; color: #C7D2FE; }
    .ai-void-todo-chevron {
        width: 18px; height: 18px; flex: 0 0 18px;
        display: grid; place-items: center;
        color: #C7D2FE; font-size: 10px;
        transition: transform .22s ease; opacity: .85;
    }
    #ai-void-todo-dock:not(.is-collapsed) .ai-void-todo-chevron { transform: rotate(180deg); }
    .ai-void-todo-side {
        width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px;
        background: transparent; color: #C7D2FE; cursor: pointer;
    }
    .ai-void-todo-side:hover { background: rgba(255,255,255,.09); }
    .ai-void-todo-list {
        display: grid; gap: 3px;
        max-height: calc(min(56vh, 430px) - 42px);
        padding: 7px; overflow: auto;
    }
    .ai-void-todo-row {
        display: flex; align-items: flex-start; min-width: 0; gap: 8px;
        padding: 6px; border: 0; border-radius: 8px;
        background: transparent; color: inherit;
        font: 12px/1.35 system-ui, sans-serif;
        text-align: start; cursor: pointer;
    }
    .ai-void-todo-row:hover { background: rgba(255,255,255,.07); }
    .ai-void-todo-check {
        width: 16px; height: 16px; flex: 0 0 16px;
        margin-top: 1px;
        display: grid; place-items: center;
        border: 1px solid rgba(199,210,254,.58);
        border-radius: 5px; color: white; font-size: 11px;
    }
    .ai-void-todo-row.done { opacity: .5; }
    .ai-void-todo-row.done .ai-void-todo-check { background: #10B981; border-color: #10B981; }
    .ai-void-todo-row.done .ai-void-todo-text { text-decoration: line-through; }
    .ai-void-todo-text {
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        min-width: 0;
    }
    .ai-void-todo-empty { padding: 16px 5px; color: rgba(224,231,255,.5); font-size: 11px; text-align: center; }

    /* Gmail profile edit dialog */
    #ai-void-profile-dialog {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: none;
        place-items: center;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px);
    }
    #ai-void-profile-dialog.open { display: grid; }
    .ai-void-profile-card {
        width: min(340px, calc(100vw - 32px));
        padding: 16px;
        border-radius: 16px;
        background: rgba(16, 20, 36, 0.96);
        border: 1px solid rgba(165, 180, 252, 0.25);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        color: #EEF2FF;
    }
    .ai-void-profile-card h3 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 700;
    }
    .ai-void-profile-card label {
        display: block;
        font-size: 11px;
        color: rgba(226,232,255,0.65);
        margin: 8px 0 4px;
    }
    .ai-void-profile-card input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid rgba(165,180,252,0.25);
        background: rgba(255,255,255,0.06);
        color: #F8FAFC;
        font: 13px system-ui, sans-serif;
        outline: none;
    }
    .ai-void-profile-card input:focus {
        border-color: rgba(165,180,252,0.55);
    }
    .ai-void-profile-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
    }
    .ai-void-profile-actions button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 0;
        font: 12px system-ui, sans-serif;
        cursor: pointer;
    }
    .ai-void-profile-save {
        background: #4f46e5;
        color: #fff;
    }
    .ai-void-profile-cancel {
        background: rgba(255,255,255,0.08);
        color: #E5E7EB;
    }
    .ai-void-profile-delete {
        margin-right: auto;
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
    }

    @media (max-width: 700px) {
        #ai-void-stage { top: 36%; width: calc(100vw - 24px); gap: 14px; }
        #ai-void-search-brand-name { font-size: 18px; }
        #ai-void-todo-dock { top: auto !important; bottom: 16px; width: min(320px, calc(100vw - 32px)); }
    }
    @media (prefers-reduced-motion: reduce) {
        .ai-void-search-brand-pulse { animation: none; }
        #ai-ntp-quickbar { transition: none; }
    }
</style>
</head>

<body>

<canvas id="starfield"></canvas>
<div class="space-vignette"></div>

<div id="ai-ntp-menu">
  <button type="button" id="ai-ntp-menu-btn" title="Menu">☰</button>
  <div id="ai-ntp-menu-panel" role="menu">
    <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-focus">
      <span>🎯 <span id="ai-ntp-menu-focus-label">Focus Mode</span></span>
      <span class="ai-ntp-menu-check">✓</span>
    </button>
    <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-topsites" data-on="1">
      <span>🔗 <span id="ai-ntp-menu-topsites-label">Frequent Links</span></span>
      <span class="ai-ntp-menu-check">✓</span>
    </button>
    <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-settings">
      <span>⚙️ <span id="ai-ntp-menu-settings-label">Settings</span></span>
      <span class="ai-ntp-menu-check"></span>
    </button>
    <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-stdtab">
      <span>🌐 <span id="ai-ntp-menu-stdtab-label">Use Standard New Tab</span></span>
      <span class="ai-ntp-menu-check"></span>
    </button>
  </div>
</div>

<div id="ai-ntp-quickbar" role="toolbar" aria-label="Quick links">
  <a href="https://mail.google.com/mail/u/0/" target="_blank" rel="noopener" title="Gmail">✉️</a>
  <a id="ai-ntp-account" href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fmail.google.com" target="_blank" rel="noopener" title="Switch account">👤</a>
</div>

<section id="ai-void-stage">
  <div id="ai-void-search" aria-label="Web search">
    <div class="ai-void-search-brand-row">
      <button type="button" class="ai-void-search-nav" id="ai-void-search-prev" title="Previous engine" aria-label="Previous search engine">‹</button>
      <div id="ai-void-search-brand" data-engine="google" title="Swipe or click to switch engine">
        <span class="ai-void-search-brand-mark" aria-hidden="true"></span>
        <span id="ai-void-search-brand-name">Google</span>
      </div>
      <button type="button" class="ai-void-search-nav" id="ai-void-search-next" title="Next engine" aria-label="Next search engine">›</button>
    </div>
    <form class="ai-void-search-box" id="ai-void-search-form" action="#" onsubmit="return false;">
      <svg class="ai-void-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="ai-void-search-input" name="q" autocomplete="off" spellcheck="false" dir="auto" placeholder="Search with Google…" />
      <button type="button" id="ai-void-search-go" title="Search" aria-label="Search">→</button>
    </form>
    <div id="ai-void-search-dots" role="tablist" aria-label="Search engines"></div>
  </div>

  <div id="ai-void-apps" aria-label="Gmail and account shortcuts"></div>
  <div id="ai-ntp-topsites"></div>
</section>

<aside id="ai-void-todo-dock" class="is-collapsed" data-side="right" aria-label="Daily tasks">
  <div class="ai-void-todo-head" id="ai-void-todo-handle" role="button" tabindex="0" aria-expanded="false" title="Show / hide tasks">
    <span>✓</span><span class="ai-void-todo-title" id="ai-void-todo-title">Today's tasks</span><span class="ai-void-todo-count" id="ai-void-todo-count"></span>
    <span class="ai-void-todo-chevron" id="ai-void-todo-chevron" aria-hidden="true">▾</span>
    <button type="button" class="ai-void-todo-side" id="ai-void-todo-side" title="Move to other side">↔</button>
  </div>
  <div class="ai-void-todo-list" id="ai-void-todo-list"></div>
</aside>

<div id="ai-void-profile-dialog" role="dialog" aria-modal="true" aria-labelledby="ai-void-profile-title">
  <div class="ai-void-profile-card">
    <h3 id="ai-void-profile-title">Gmail profile</h3>
    <label for="ai-void-profile-label">Label</label>
    <input id="ai-void-profile-label" type="text" maxlength="24" placeholder="Work, Personal…" autocomplete="off" />
    <label for="ai-void-profile-url">URL</label>
    <input id="ai-void-profile-url" type="url" dir="ltr" placeholder="https://mail.google.com/mail/u/0/" autocomplete="off" />
    <div class="ai-void-profile-actions">
      <button type="button" class="ai-void-profile-delete" id="ai-void-profile-delete" hidden>Delete</button>
      <button type="button" class="ai-void-profile-cancel" id="ai-void-profile-cancel">Cancel</button>
      <button type="button" class="ai-void-profile-save" id="ai-void-profile-save">Save</button>
    </div>
  </div>
</div>

<script src="void-starfield.js"></script>
<script src="void-tab-search.js"></script>
<script src="void-tab-shortcuts.js"></script>
<script src="void-tab-apps.js"></script>
<script src="void-tab-topsites.js"></script>
<script src="void-tab-account.js"></script>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="toolbar-zen.css">
<script src="i18n.js"></script>
<script src="calendar-engine.js"></script>
<script src="quote-engine.js"></script>
<script src="voice-engine.js"></script>
<script src="toolbar-icons.js"></script>
<script src="toolbar-dock.js"></script>
<script src="content.js"></script>

<script src="void-tab-menu.js"></script>
<script src="void-tab-todo.js"></script>

</body>
</html>
