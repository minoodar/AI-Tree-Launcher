<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- به مرورگر می‌گه این سند تیره‌ست — روی برخی نسخه‌های Chromium حتی خودِ
     پسِ‌زمینهٔ پیش‌فرضِ UA (قبل از اجرای هر CSS/JSای) رو هم تیره می‌کنه. -->
<meta name="color-scheme" content="dark">
<!-- زودترین چیزِ ممکن در <head>: پس‌زمینهٔ تیره را همون لحظهٔ اول ست می‌کند
     تا اگر مرورگر پیش از اجرای اسکریپتِ زیر یک فریم پینت کرد، سفیدِ
     پیش‌فرضِ UA دیده نشه. -->
<style>html, body { background: #000; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Tab</title>

<!-- باید همیشه اولین اسکریپت در <head> بماند -->
<script src="void-tab-router.js"></script>

<style>
    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }

    body {
        position: relative;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
    }

    /* Boot: kill motion until router + storage state applied (no layout thrash on new tab) */
    html.void-booting *,
    html.void-booting *::before,
    html.void-booting *::after {
        transition: none !important;
        animation: none !important;
    }


    #starfield {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
    }

    .space-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0, 0, 0, 0.08) 45%,
                rgba(0, 0, 0, 0.48) 100%
            );
    }

    @media (prefers-reduced-motion: reduce) {
        #starfield { animation: none; }
    }

    /* ---- Top-right chrome: Menu · Gmail · Account (always visible) ---- */
    #ai-ntp-quickbar {
        position: fixed;
        top: 14px;
        right: 14px;
        left: auto;
        z-index: 800;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        border-radius: 12px;
        background: rgba(20, 22, 30, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.14);
        opacity: 1;
        overflow: visible;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        transition: left 0.2s ease, right 0.2s ease;
    }
    #ai-ntp-quickbar[data-side="left"] { left: 14px; right: auto; }
    #ai-ntp-quickbar[data-side="right"] { right: 14px; left: auto; }
    #ai-ntp-quickbar > a,
    #ai-ntp-quickbar > button,
    #ai-ntp-menu-btn,
    #ai-ntp-apps-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #F3F4F6;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    #ai-ntp-quickbar > a:hover,
    #ai-ntp-quickbar > button:hover,
    #ai-ntp-menu-btn:hover,
    #ai-ntp-menu.open #ai-ntp-menu-btn,
    #ai-ntp-apps-btn:hover,
    #ai-ntp-apps-wrap.open #ai-ntp-apps-btn {
        background: rgba(255, 255, 255, 0.12);
        transform: scale(1.1);
    }
    /* رنگِ کهربایی/نارنجیِ سیارهٔ حلقه‌دار — تنها آیکونِ رنگی توی کوییک‌بار،
       عمداً برای جلبِ توجه، هم‌راستا با پالتِ کهربایی‌ای که جاهای دیگهٔ صفحه
       (رویدادهای امروز، Goals و...) هم استفاده می‌کنن. */
    #ai-ntp-apps-btn { color: rgba(251, 191, 36, 0.92); }
    #ai-ntp-apps-btn:hover,
    #ai-ntp-apps-wrap.open #ai-ntp-apps-btn {
        color: #FBBF24;
        background: rgba(251, 191, 36, 0.14);
    }

    /* ---- Center stage: search + shortcuts + topsites ---- */
    #ai-void-stage {
        position: fixed;
        left: 50%;
        top: max(88px, 18vh);
        transform: translateX(-50%);
        z-index: 40;
        width: min(640px, calc(100vw - 32px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        pointer-events: none;
    }
    #ai-void-stage > * { pointer-events: auto; }

    /* Multi-engine search */
    #ai-void-search {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .ai-void-search-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
        user-select: none;
    }
    .ai-void-search-nav {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        color: rgba(226,232,255,0.75);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        display: grid;
        place-items: center;
        transition: background .15s ease, color .15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-void-search-nav:hover {
        background: rgba(255,255,255,0.12);
        color: #fff;
        transform: scale(1.14);
    }
    #ai-void-search-brand {
        --engine-accent: #8ab4f8;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(12, 16, 32, 0.45);
        border: 1px solid rgba(165, 180, 252, 0.18);
        cursor: pointer;
        transition: border-color .2s ease, box-shadow .2s ease;
    }
    #ai-void-search-brand:hover {
        border-color: rgba(165, 180, 252, 0.35);
        box-shadow: 0 0 0 1px rgba(165,180,252,0.08), 0 8px 24px rgba(0,0,0,0.25);
    }
    .ai-void-search-brand-pulse { animation: aiVoidBrandPulse .35s ease; }
    @keyframes aiVoidBrandPulse {
        0% { transform: scale(0.96); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
    .ai-void-search-brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff 0%, var(--engine-accent) 45%, transparent 70%);
        box-shadow: 0 0 12px color-mix(in srgb, var(--engine-accent) 55%, transparent);
        flex: 0 0 22px;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    #ai-void-search-brand:hover .ai-void-search-brand-mark {
        transform: scale(1.16);
    }
    #ai-void-search-brand-name {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #F1F5FF;
        text-shadow: 0 1px 12px rgba(0,0,0,0.45);
    }
    .ai-void-search-box {
        width: 100%;
        max-width: 584px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px 6px 16px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
            0 1px 2px rgba(0,0,0,0.08),
            0 8px 28px rgba(0,0,0,0.28),
            0 0 0 1px rgba(165,180,252,0.08);
        transition: box-shadow .2s ease;
    }
    .ai-void-search-box:focus-within {
        box-shadow:
            0 1px 2px rgba(0,0,0,0.06),
            0 12px 36px rgba(0,0,0,0.35),
            0 0 0 2px color-mix(in srgb, var(--engine-accent, #8ab4f8) 55%, transparent);
    }
    .ai-void-search-icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        opacity: 0.45;
        color: #3c4043;
    }
    #ai-void-search-input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #202124;
        padding: 10px 4px;
    }
    #ai-void-search-input::placeholder { color: #80868b; }
    #ai-void-search-go {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: #1a2338;
        color: #e8eeff;
        font-size: 18px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease, transform .12s ease;
    }
    #ai-void-search-go:hover { background: #2a3654; transform: scale(1.04); }
    #ai-void-search-dots {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        min-height: 12px;
    }
    .ai-void-search-dot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(226, 232, 255, 0.28);
        cursor: pointer;
        transition: transform .15s ease, background .15s ease;
    }
    .ai-void-search-dot.is-active {
        background: var(--engine-accent, #a5b4fc);
        transform: scale(1.35);
        box-shadow: 0 0 8px color-mix(in srgb, var(--engine-accent, #a5b4fc) 60%, transparent);
    }

    /* Apps ▦ inside quickbar (NOT under search) */
    #ai-ntp-apps-wrap { position: relative; z-index: 3; }
    #ai-ntp-apps-btn {
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 8px; border: none; background: transparent;
        color: #F3F4F6; font-size: 15px; cursor: pointer;
    }
    #ai-ntp-apps-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 220px;
        max-width: min(340px, calc(100vw - 24px));
        background: rgba(20, 22, 30, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 10px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transform-origin: top right;
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
        z-index: 810;
    }
    #ai-ntp-apps-wrap.open #ai-ntp-apps-panel {
        opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto;
    }
    #ai-ntp-quickbar[data-side="left"] #ai-ntp-apps-panel {
        left: 0; right: auto; transform-origin: top left;
    }
    #ai-void-apps {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 0; margin: 0; opacity: 1; min-height: 0;
    }
    .ai-void-app {
        width: auto; min-width: 0;
        display: flex; flex-direction: column; align-items: center;
        gap: 4px; padding: 8px 4px 6px; border-radius: 12px;
        text-decoration: none; color: #E5E7EB;
        border: 1px solid transparent; background: transparent;
        cursor: pointer; font: inherit;
        transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .ai-void-app:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.07);
        transform: translateY(-1px);
    }
    .ai-void-app-icon {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: rgba(226, 232, 255, 0.82);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-void-app:hover .ai-void-app-icon,
    .ai-void-app:focus-within .ai-void-app-icon {
        transform: scale(1.16);
    }
    .ai-void-app-icon img,
    .ai-void-app-icon svg {
        width: 14px;
        height: 14px;
        object-fit: contain;
    }
    /* Brand identity is a hint of color in the glyph only — no filled blocks */
    .ai-void-app-icon.is-mail { color: #f28b82; }
    .ai-void-app-icon.is-drive { color: #7ecb92; }
    .ai-void-app-icon.is-cal { color: #8ab4f8; }
    .ai-void-app-icon.is-photos { color: #fdd663; }
    .ai-void-app-icon.is-custom { color: rgba(226, 232, 255, 0.82); }
    .ai-void-app-label {
        font-size: 10px; color: rgba(226, 232, 255, 0.7);
        max-width: 100%; width: 100%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    }
    .ai-void-app-add {
        opacity: 0.55;
    }
    .ai-void-app-add:hover { opacity: 1; }
    .ai-void-app-add .ai-void-app-icon {
        background: rgba(255,255,255,0.04);
        border-style: dashed;
        color: rgba(226,232,255,0.6);
        font-size: 15px;
        font-weight: 400;
    }
    .ai-void-app { position: relative; }
    .ai-void-app-edit {
        position: absolute;
        top: 1px;
        inset-inline-end: 1px;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 6px;
        background: rgba(10, 14, 28, 0.82);
        color: #fff;
        font-size: 9px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: translateY(-2px);
        transition: opacity .15s ease, transform .15s ease, background .15s ease;
    }
    .ai-void-app:hover .ai-void-app-edit,
    .ai-void-app:focus-within .ai-void-app-edit {
        opacity: 1;
        transform: translateY(0);
    }
    .ai-void-app-edit:hover { background: rgba(79, 70, 229, 0.92); }
    .ai-void-app-add .ai-void-app-edit { display: none; }

    /* Account indicator avatar */
    .ai-ntp-avatar {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(145deg, #7c6af2, #4f46e5);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    }

    /* Most visited — under shortcuts. Same quiet scale/behavior as #ai-void-apps
       so the two rows read as one calm system, not two different weights. */
    #ai-ntp-topsites {
        width: 100%; display: flex; flex-wrap: wrap; justify-content: center;
        gap: 8px; max-width: 600px; min-height: 64px; opacity: 0.72; transition: opacity 0.25s ease;
    }
    #ai-ntp-topsites:hover, #ai-ntp-topsites:focus-within {
        opacity: 1;
    }
    #ai-ntp-topsites.hidden { display: none; }
    .ai-ts-tile {
        width: 58px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        padding: 6px 2px 4px;
        border-radius: 12px;
        transition: background 0.2s ease, transform 0.22s cubic-bezier(.34,1.45,.64,1);
        will-change: transform;
    }
    .ai-ts-tile:hover,
    .ai-ts-tile-wrap:hover .ai-ts-tile,
    .ai-ts-tile-wrap:focus-within .ai-ts-tile {
        background: rgba(255, 255, 255, 0.08);
        transform: scale(1.14);
    }
    .ai-ts-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition:
            transform .22s cubic-bezier(.34,1.56,.64,1),
            box-shadow .22s ease,
            border-color .22s ease,
            background .22s ease;
    }
    .ai-ts-tile:hover .ai-ts-icon,
    .ai-ts-tile-wrap:hover .ai-ts-icon,
    .ai-ts-tile-wrap:focus-within .ai-ts-icon {
        transform: scale(1.22);
        border-color: rgba(165, 180, 252, 0.45);
        background: rgba(129, 140, 248, 0.16);
        box-shadow:
            0 0 0 1px rgba(165, 180, 252, 0.2),
            0 0 16px rgba(99, 102, 241, 0.45),
            0 4px 12px rgba(0, 0, 0, 0.25);
    }
    .ai-ts-icon img { width: 16px; height: 16px; }
    .ai-ts-label {
        font-size: 9.5px;
        font-weight: 600;
        color: rgba(226, 232, 255, 0.62);
        max-width: 64px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        letter-spacing: 0.01em;
        transition:
            color 0.2s ease,
            text-shadow 0.2s ease,
            font-size 0.2s ease,
            opacity 0.2s ease;
    }
    .ai-ts-tile:hover .ai-ts-label,
    .ai-ts-tile-wrap:hover .ai-ts-label,
    .ai-ts-tile-wrap:focus-within .ai-ts-label {
        color: #F8FAFC;
        font-size: 10.5px;
        max-width: 72px;
        text-shadow:
            0 0 8px rgba(199, 210, 254, 0.95),
            0 0 16px rgba(129, 140, 248, 0.65),
            0 1px 2px rgba(0, 0, 0, 0.45);
    }
    .ai-ts-tile-wrap {
        position: relative;
        /* room above icon so edit/remove stay visible while tile zooms */
        padding-top: 14px;
        margin-top: -4px;
    }
    .ai-ts-controls {
        position: absolute;
        top: 0;
        left: 50%;
        right: auto;
        inset-inline-end: auto;
        display: flex;
        gap: 3px;
        opacity: 0;
        transform: translate(-50%, -4px);
        z-index: 5;
        pointer-events: none;
        transition: opacity .18s ease, transform .18s cubic-bezier(.34,1.4,.64,1);
    }
    .ai-ts-tile-wrap:hover .ai-ts-controls,
    .ai-ts-tile-wrap:focus-within .ai-ts-controls {
        opacity: 1;
        transform: translate(-50%, -10px);
        pointer-events: auto;
    }
    .ai-ts-ctrl-btn {
        width: 18px;
        height: 18px;
        border: 1px solid rgba(165, 180, 252, 0.28);
        border-radius: 6px;
        background: rgba(10, 14, 28, 0.92);
        color: #E5E7EB;
        font-size: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease;
    }
    .ai-ts-ctrl-btn:hover { background: rgba(79, 70, 229, 0.9); }
    .ai-ts-ctrl-remove:hover { background: rgba(239, 68, 68, 0.9); }
    .ai-ts-tile-add {
        border: 1px dashed rgba(255, 255, 255, 0.18);
        background: transparent;
        font: inherit;
        color: inherit;
        opacity: 0.6;
    }
    .ai-ts-tile-add:hover { opacity: 1; background: rgba(255,255,255,0.05); }
    .ai-ts-icon-add {
        font-size: 15px;
        font-weight: 400;
        color: rgba(226, 232, 255, 0.7);
        background: rgba(255, 255, 255, 0.04);
        border-style: dashed;
    }

    /* Menu nested inside quickbar cluster */
    #ai-ntp-menu { position: relative; z-index: 2; }
    #ai-ntp-menu-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        left: auto;
        transform-origin: top right;
        min-width: 220px;
        background: rgba(20, 22, 30, 0.94);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(-6px) scaleY(0.96);
        transform-origin: top right;
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease;
    }
    #ai-ntp-quickbar[data-side="left"] #ai-ntp-menu-panel {
        left: 0; right: auto; transform-origin: top left;
    }
    #ai-ntp-menu.open #ai-ntp-menu-panel {
        opacity: 1;
        transform: translateY(0) scaleY(1);
        pointer-events: auto;
    }
    .ai-ntp-menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        background: none;
        border: none;
        color: #E5E7EB;
        font-size: 12.5px;
        font-family: inherit;
        text-align: inherit;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .ai-ntp-menu-item:hover { background: rgba(255, 255, 255, 0.08); }
    .ai-ntp-menu-item .ai-ntp-menu-check {
        font-size: 11px;
        color: #6EE7B7;
        opacity: 0;
    }
    .ai-ntp-menu-item[data-on="1"] .ai-ntp-menu-check { opacity: 1; }

    body.ai-focus-mode #ai-ntp-topsites,
        body.ai-focus-mode #ai-orbit-root {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.3s ease;
    }
    body.ai-focus-mode #ai-void-search {
        opacity: 0.35;
    }


    /* ---- Today's Echo (collapsible zen card) ---- */
    #ai-void-echo {
        width: 100%; max-width: 360px; border-radius: 16px;
        background: rgba(8, 12, 28, 0.42); border: 1px solid rgba(165, 180, 252, 0.12);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        overflow: hidden; transition: opacity 0.25s ease, max-height 0.28s cubic-bezier(.16,1,.3,1);
    }
    #ai-void-echo[hidden] { display: none !important; }
    #ai-void-echo.is-collapsed { max-height: 40px; }
    #ai-void-echo:not(.is-collapsed) { max-height: 220px; }
    #ai-void-echo.is-collapsed .ai-void-echo-content { display: none; }
    .ai-void-echo-handle {
        display: flex; align-items: center; gap: 8px; padding: 9px 12px;
        cursor: pointer; user-select: none; color: rgba(199, 210, 254, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    #ai-void-echo.is-collapsed .ai-void-echo-handle { border-bottom-color: transparent; }
    .ai-void-echo-handle:hover { background: rgba(255, 255, 255, 0.04); }
    .ai-void-echo-icon { width: 18px; height: 18px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; color: rgba(167, 139, 250, 0.9); }
    .ai-void-echo-icon svg { width: 16px; height: 16px; display: block; }
    .ai-void-echo-title { flex: 1 1 auto; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(199, 210, 254, 0.78); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-void-echo-count { font-size: 10.5px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: rgba(167, 139, 250, 0.18); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, 0.28); }
    .ai-void-echo-count[hidden] { display: none !important; }
    .ai-void-echo-chevron { font-size: 11px; opacity: 0.65; transition: transform 0.22s ease; flex: 0 0 auto; }
    #ai-void-echo:not(.is-collapsed) .ai-void-echo-chevron { transform: rotate(180deg); }
    .ai-void-echo-content { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 12px 12px; }
    .ai-void-echo-body { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
    .ai-void-echo-chip { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: rgba(255,255,255,0.92); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
    .ai-void-echo-chip--done { background: rgba(16,185,129,0.14); border-color: rgba(16,185,129,0.28); color: #6ee7b7; }
    .ai-void-echo-chip--event { background: rgba(56,189,248,0.12); border-color: rgba(56,189,248,0.26); color: #7dd3fc; }
    .ai-void-echo-chip--cleared { background: rgba(167,139,250,0.12); border-color: rgba(167,139,250,0.24); color: #c4b5fd; }
    .ai-void-echo-pattern { font-size: 11px; font-weight: 500; color: rgba(199,210,254,0.52); text-align: center; line-height: 1.35; max-width: 100%; }
    .ai-void-echo-pattern[hidden] { display: none !important; }
    body.ai-focus-mode #ai-void-echo { opacity: 0 !important; pointer-events: none !important; }

    /* Todo dock — z-index رو حالا حتی از خودِ استیجِ اصلی (۴۰) هم پایین‌تر
       گذاشتیم (۳۰): طبقِ خواستِ کاربر، وقتی داک باز/گسترده می‌شه و با سرچ/
       Echo/Goals هم‌پوشانی پیدا می‌کنه، باید *زیرِ* اون‌ها بمونه، نه روشون -
       کوییک‌بار (۸۰۰) و دیالوگِ ویرایش (۹۹۹۹۹۹) هنوز از همه بالاترن. */
    #ai-void-todo-dock {
        position: fixed; top: 22%; z-index: 30;
        display: block !important; visibility: visible !important; opacity: 1 !important;
        pointer-events: auto !important;
        width: min(300px, calc(100vw - 32px));
        max-height: min(64vh, 520px);
        color: #EEF2FF;
        background: rgba(10, 14, 28, .7);
        border: 1px solid rgba(165, 180, 252, .28);
        border-radius: 14px;
        backdrop-filter: blur(18px) saturate(1.15);
        -webkit-backdrop-filter: blur(18px) saturate(1.15);
        box-shadow: 0 15px 42px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06);
        overflow: hidden;
        transition: box-shadow .2s ease, opacity .2s ease, max-height .28s cubic-bezier(.16,1,.3,1);
    }
    /* قانونِ بالا با !important همیشه display/visibility/opacity رو force
       می‌کنه — یعنی خاموش‌کردنِ داک از منوی سه‌تایی (که با dock.hidden=true
       کار می‌کنه) بدونِ این override اصلاً اثر نداشت. چون [hidden] یه
       سلکتورِ خاص‌ترـه (attribute selector اضافه)، این قانون روی قانونِ
       بالا برنده می‌شه. */
    #ai-void-todo-dock[hidden] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
    }
    #ai-void-todo-dock[data-side="right"] { right: 16px; }
    #ai-void-todo-dock[data-side="left"] { left: 16px; }
    #ai-void-todo-dock:hover { box-shadow: 0 18px 48px rgba(0,0,0,.48), 0 0 0 1px rgba(165,180,252,.13); }
    #ai-void-todo-dock.is-collapsed { max-height: 42px; }
    #ai-void-todo-dock.is-collapsed .ai-void-agenda-body { display: none; }
    #ai-void-todo-dock.is-collapsed .ai-void-todo-head { border-bottom-color: transparent; }
    .ai-void-todo-head {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px solid rgba(255,255,255,.07);
        cursor: pointer; user-select: none;
    }
    .ai-void-todo-head:active { cursor: grabbing; }
    .ai-void-todo-title { font-size: 12px; font-weight: 800; letter-spacing: .02em; }
    .ai-void-todo-count { margin-inline-start: auto; font-size: 10px; color: #C7D2FE; }
    .ai-void-todo-chevron {
        width: 18px; height: 18px; flex: 0 0 18px;
        display: grid; place-items: center;
        color: #C7D2FE; font-size: 10px;
        transition: transform .22s ease; opacity: .85;
    }
    #ai-void-todo-dock:not(.is-collapsed) .ai-void-todo-chevron { transform: rotate(180deg); }
    .ai-void-todo-side {
        width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px;
        background: transparent; color: #C7D2FE; cursor: pointer;
    }
    .ai-void-todo-side:hover { background: rgba(255,255,255,.09); }
    .ai-void-agenda-body {
        display: flex; flex-direction: column; gap: 10px;
        max-height: calc(min(64vh, 520px) - 42px);
        padding: 9px 10px 10px; overflow: auto;
        /* اسکرول‌بارِ نازک و هم‌رنگِ تمِ دارک به‌جای اسکرول‌بارِ خاکستریِ
           پیش‌فرضِ مرورگر؛ فقط موقعِ هاور/اسکرول پررنگ می‌شه. */
        scrollbar-width: thin;
        scrollbar-color: rgba(165, 180, 252, .3) transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
    }
    .ai-void-agenda-body::-webkit-scrollbar { width: 6px; }
    .ai-void-agenda-body::-webkit-scrollbar-track { background: transparent; }
    .ai-void-agenda-body::-webkit-scrollbar-thumb {
        background: rgba(165, 180, 252, .22);
        border-radius: 999px;
        border: 1.5px solid transparent;
        background-clip: padding-box;
    }
    .ai-void-agenda-body:hover::-webkit-scrollbar-thumb,
    .ai-void-agenda-body::-webkit-scrollbar-thumb:hover {
        background: rgba(165, 180, 252, .5);
        background-clip: padding-box;
    }
    /* سرِ بخش: تاریخ (میلادی + شمسی) و سن — دقیقاً همان منطقِ خودِ ساعت/تقویمِ
       ویجتِ اصلی، اما مستقل محاسبه می‌شود چون پنلِ ساعتِ اصلی فقط وقتی باز است
       به‌روزرسانی می‌شود، و این داک باید همیشه (حتی بسته) درست باشد. */
    .ai-void-agenda-datehead {
        display: flex; flex-direction: column; gap: 3px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .ai-void-agenda-date-primary { font-size: 12.5px; font-weight: 700; color: #F1F5FF; letter-spacing: .01em; }
    .ai-void-agenda-date-secondary {
        font-size: 13px;
        font-weight: 700;
        color: #C7D2FE;
        letter-spacing: .01em;
        text-shadow: 0 0 12px rgba(129, 140, 248, 0.35);
    }
    .ai-void-agenda-date-tertiary {
        font-size: 11px;
        font-weight: 600;
        color: rgba(196, 181, 253, 0.78);
        letter-spacing: .02em;
        margin-top: 1px;
    }
    .ai-void-agenda-age { font-size: 10px; color: rgba(251,191,36,.75); margin-top: 3px; font-weight: 600; }
    .ai-void-agenda-journey { margin-top: 6px; }
    .ai-void-agenda-journey-top {
        display: flex; justify-content: space-between;
        font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em;
        color: rgba(199,210,254,.45); margin-bottom: 3px;
    }
    .ai-void-agenda-journey-track {
        height: 4px; border-radius: 999px;
        background: rgba(255,255,255,.06);
        overflow: hidden;
    }
    .ai-void-agenda-journey-fill {
        height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #7c6af2, #FBBF24);
    }
    .ai-void-agenda-journey-caption {
        font-size: 9.5px; color: rgba(199,210,254,.55); margin-top: 3px; text-align: center;
    }
    .ai-void-agenda-birth {
        margin-top: 5px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        letter-spacing: 0.15px;
        line-height: 1.4;
    }
    .ai-void-agenda-birth-j {
        font-size: 10px;
        font-weight: 600;
        color: rgba(167, 243, 208, 0.9);
        direction: rtl;
    }
    .ai-void-agenda-birth-g {
        font-size: 9.5px;
        font-weight: 600;
        color: rgba(186, 230, 253, 0.78);
        direction: ltr;
    }
    .ai-void-agenda-family-toggle {
        display: block; width: 100%; margin-top: 6px; padding: 4px 8px;
        border: 1px dashed rgba(165,180,252,.25); border-radius: 7px;
        background: rgba(255,255,255,0.03); color: rgba(199,210,254,.7);
        font-size: 9.5px; font-weight: 700; font-family: inherit; cursor: pointer;
        text-align: center;
    }
    .ai-void-agenda-family-toggle.is-open {
        border-style: solid; border-color: rgba(52,211,153,.35);
        background: rgba(16,185,129,.08);
    }
    .ai-void-agenda-family {
        margin-top: 5px; display: flex; flex-direction: column; gap: 3px;
        padding: 4px 0 0;
        animation: voidFamilyOpen 0.22s ease;
    }
    @keyframes voidFamilyOpen {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .ai-void-agenda-family-row {
        font-size: 9.5px; color: rgba(199,210,254,.75); text-align: center; font-weight: 600;
        padding: 3px 6px; border-radius: 6px; background: rgba(255,255,255,0.03);
    }
    .ai-void-agenda-family-row.is-primary {
        color: #A7F3D0; background: rgba(16,185,129,.1);
    }
    .ai-void-agenda-mark-line {
        font-size: 10.5px; color: rgba(199,210,254,.7);
        margin-top: 5px; direction: auto; text-align: start;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ai-void-agenda-mark-line.is-today { color: #FDE68A; font-weight: 700; }
    .ai-void-agenda-section-title {
        font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
        color: rgba(199,210,254,.55); margin-bottom: 5px;
    }
    .ai-void-agenda-events { display: grid; gap: 4px; }
    .ai-void-todo-list { display: grid; gap: 3px; }
    .ai-void-event-row {
        display: flex; align-items: baseline; gap: 8px;
        padding: 5px 7px; border-radius: 7px;
        background: rgba(255,255,255,.03);
        font-size: 11.5px;
        cursor: pointer;
        transition: background .15s ease;
    }
    .ai-void-event-row:hover { background: rgba(255,255,255,.065); }
    .ai-void-event-time {
        font-family: 'SF Mono', Consolas, monospace;
        font-weight: 700; flex: 0 0 auto;
        color: rgba(251,191,36,.85);
    }
    .ai-void-event-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: auto; text-align: start; color: #EEF2FF; }
    .ai-void-event-time {
        cursor: pointer;
        border-radius: 4px;
        padding: 0 2px;
        transition: background .15s ease;
    }
    .ai-void-event-time:hover { background: rgba(251,191,36,.16); }
    .ai-void-event-time-input {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 11.5px;
        font-weight: 700;
        color: #0F172A;
        background: #FBBF24;
        border: 0; border-radius: 4px;
        padding: 0 2px;
        width: 58px;
        flex: 0 0 auto;
    }
    .ai-void-event-del {
        flex: 0 0 auto;
        width: 16px; height: 16px;
        border: 0; border-radius: 5px;
        background: transparent; color: rgba(255,255,255,.35);
        font-size: 12px; line-height: 1;
        cursor: pointer;
        margin-inline-start: auto;
        opacity: 0;
        transition: opacity .15s ease, background .15s ease, color .15s ease;
    }
    .ai-void-event-row:hover .ai-void-event-del,
    .ai-void-event-row:focus-within .ai-void-event-del { opacity: 1; }
    .ai-void-event-del:hover { background: rgba(239,68,68,.85); color: #fff; }
    .ai-void-event-row.is-near { background: rgba(251,191,36,.1); }
    .ai-void-event-row.is-near .ai-void-event-time { text-shadow: 0 0 8px rgba(251,191,36,.65); }
    .ai-void-event-row.is-missed .ai-void-event-time { text-decoration: line-through; opacity: .55; }
    .ai-void-event-row.is-missed .ai-void-event-title { color: #FCA5A5; }
    .ai-void-event-row.is-done { opacity: .5; }
    .ai-void-event-row.is-done .ai-void-event-title { text-decoration: line-through; }
    .ai-void-event-row.is-recurring-elapsed { opacity: .6; }
    .ai-void-event-badge {
        flex: 0 0 auto; font-size: 8.5px; font-weight: 700;
        padding: 1px 6px; border-radius: 999px;
        background: linear-gradient(135deg, #FDE68A, #FBBF24); color: #0F172A;
    }
    .ai-void-event-empty, .ai-void-todo-empty { padding: 10px 5px; color: rgba(224,231,255,.5); font-size: 11px; text-align: center; }
    /* پیش‌نمایشِ فشردهٔ فردا — همان زبانِ بصریِ کادرِ داشبوردِ اصلی، در اندازهٔ داک */
    .ai-void-tomorrow-box {
        margin-top: 4px; padding: 6px 8px;
        border: 1px dashed rgba(251,191,36,.28);
        border-radius: 8px;
        background: rgba(251,191,36,.04);
        cursor: pointer;
    }
    .ai-void-tomorrow-box:hover { background: rgba(251,191,36,.08); }
    .ai-void-tomorrow-head { font-size: 9.5px; font-weight: 700; color: rgba(251,191,36,.75); text-transform: uppercase; letter-spacing: .04em; }
    .ai-void-tomorrow-row { display: flex; gap: 6px; font-size: 10.5px; color: rgba(255,255,255,.62); margin-top: 3px; }
    .ai-void-tomorrow-row .ai-void-event-time { font-size: 10px; }
    .ai-void-todo-row {
        display: flex; align-items: flex-start; min-width: 0; gap: 8px;
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgba(255,255,255,.03);
        color: inherit;
        font: 12px/1.35 system-ui, sans-serif;
        text-align: start; cursor: pointer;
        transition: background .15s ease, border-color .15s ease, box-shadow .18s ease;
    }
    .ai-void-todo-row:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.06); }
    .ai-void-todo-check {
        width: 16px; height: 16px; flex: 0 0 16px;
        margin-top: 1px;
        display: grid; place-items: center;
        border: 1px solid rgba(199,210,254,.58);
        border-radius: 5px; color: white; font-size: 11px;
    }
    .ai-void-todo-row.done { opacity: .5; }
    .ai-void-todo-row.done .ai-void-todo-check { background: #10B981; border-color: #10B981; }
    .ai-void-todo-row.done .ai-void-todo-text { text-decoration: line-through; }
    .ai-void-todo-text {
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        min-width: 0;
    }
    .ai-void-todo-empty { padding: 16px 5px; color: rgba(224,231,255,.5); font-size: 11px; text-align: center; }

    /* دیگه بخشِ داخلیِ داک نیست — یه کارتِ مستقلِ شیشه‌ای، هم‌خانواده با
       ظاهرِ #ai-void-echo (همون رادیوس/بوردر/بلور)، زیرِ Today's Echo. */

    .ai-void-goals-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
    }
    .ai-void-goals-head .ai-void-agenda-section-title {
        flex: 1 1 auto;
        margin-bottom: 0;
    }
    .ai-void-agenda-section.is-goals {
        width: 100%; max-width: 360px; border-radius: 16px;
        margin-top: 0; padding: 10px 12px 12px;
        border: 1px solid rgba(167, 139, 250, 0.18);
        background: rgba(8, 12, 28, 0.42);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .ai-void-agenda-section.is-goals[hidden] { display: none !important; }
    .ai-void-agenda-section.is-goals .ai-void-agenda-section-title {
        color: rgba(196, 181, 253, 0.85);
    }

    /* ── Goal progress card ── */
    .ai-void-goal-card {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 9px 10px 10px;
        border-radius: 11px;
        border: 1px solid rgba(167, 139, 250, 0.28);
        background:
          linear-gradient(155deg, rgba(15, 12, 41, 0.55), rgba(48, 43, 99, 0.22) 45%, rgba(251, 191, 36, 0.06));
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.06) inset,
          0 6px 18px rgba(0, 0, 0, 0.22);
        transition: border-color .2s ease, box-shadow .25s ease;
    }
    .ai-void-goal-card:hover {
        border-color: rgba(196, 181, 253, 0.45);
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.1) inset,
          0 8px 22px rgba(0, 0, 0, 0.28),
          0 0 20px rgba(124, 106, 242, 0.12);
    }
    .ai-void-goal-card.is-complete {
        border-color: rgba(251, 191, 36, 0.45);
        box-shadow:
          0 0 0 1px rgba(251, 191, 36, 0.12) inset,
          0 0 22px rgba(251, 191, 36, 0.18);
    }
    .ai-void-goal-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
    }
    .ai-void-goal-spark {
        flex: 0 0 auto;
        font-size: 12px;
        line-height: 1.3;
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.45));
    }
    .ai-void-goal-label {
        flex: 1 1 auto;
        min-width: 0;
        font: 600 12px/1.35 system-ui, sans-serif;
        color: #F1F5FF;
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
    }
    .ai-void-goal-card.is-complete .ai-void-goal-label {
        color: #FDE68A;
        text-shadow: 0 0 12px rgba(251, 191, 36, 0.35);
    }
    .ai-void-goal-pct {
        flex: 0 0 auto;
        font: 800 11px/1 system-ui, sans-serif;
        letter-spacing: .03em;
        padding: 3px 7px;
        border-radius: 999px;
        color: #EDE9FE;
        background: rgba(15, 12, 41, 0.65);
        border: 1px solid rgba(167, 139, 250, 0.3);
        min-width: 2.6em;
        text-align: center;
        transition: color .2s ease, border-color .2s ease, box-shadow .25s ease, background .2s ease;
    }
    .ai-void-goal-pct.is-high {
        color: #0F172A;
        background: linear-gradient(135deg, #FBBF24, #FDE68A);
        border-color: rgba(251, 191, 36, 0.7);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.45);
    }

    /* Spectrum track: darkness → violet → gold radiance */
    .ai-void-goal-slider-wrap {
        position: relative;
        height: 18px;
        display: flex;
        align-items: center;
        touch-action: none;
    }
    .ai-void-goal-slider-track {
        position: absolute;
        left: 0; right: 0;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg,
          #0B0A1A 0%,
          #1E1B4B 18%,
          #4338CA 42%,
          #A78BFA 62%,
          #FBBF24 82%,
          #FEF3C7 100%);
        box-shadow:
          inset 0 1px 2px rgba(0,0,0,.45),
          0 0 8px rgba(124, 106, 242, 0.15);
        overflow: hidden;
    }
    /* Dim veil covering the unreached portion (right side) */
    .ai-void-goal-slider-veil {
        position: absolute;
        top: 0; bottom: 0; right: 0;
        background: rgba(8, 7, 18, 0.72);
        border-radius: 0 999px 999px 0;
        pointer-events: none;
        transition: width .05s linear;
    }
    .ai-void-goal-slider {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 18px;
        margin: 0;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
    }
    .ai-void-goal-slider:focus {
        outline: none;
    }
    .ai-void-goal-slider:focus-visible::-webkit-slider-thumb {
        box-shadow:
          0 0 0 3px rgba(251, 191, 36, 0.35),
          0 0 16px rgba(251, 191, 36, 0.65);
    }
    .ai-void-goal-slider::-webkit-slider-runnable-track {
        height: 8px;
        background: transparent;
        border: none;
    }
    .ai-void-goal-slider::-moz-range-track {
        height: 8px;
        background: transparent;
        border: none;
    }
    .ai-void-goal-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -4px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        background: radial-gradient(circle at 35% 30%, #FEF3C7, #FBBF24 55%, #B45309);
        box-shadow:
          0 0 0 1px rgba(15, 12, 41, 0.5),
          0 2px 6px rgba(0,0,0,.4),
          0 0 10px rgba(251, 191, 36, 0.35);
        transition: box-shadow .15s ease, transform .12s ease;
        cursor: grab;
    }
    .ai-void-goal-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        background: radial-gradient(circle at 35% 30%, #FEF3C7, #FBBF24 55%, #B45309);
        box-shadow:
          0 0 0 1px rgba(15, 12, 41, 0.5),
          0 2px 6px rgba(0,0,0,.4),
          0 0 10px rgba(251, 191, 36, 0.35);
        cursor: grab;
    }
    .ai-void-goal-slider:active::-webkit-slider-thumb {
        cursor: grabbing;
        transform: scale(1.12);
        box-shadow:
          0 0 0 2px rgba(251, 191, 36, 0.35),
          0 2px 8px rgba(0,0,0,.45),
          0 0 18px rgba(251, 191, 36, 0.7);
    }
    .ai-void-goal-slider:active::-moz-range-thumb {
        cursor: grabbing;
        transform: scale(1.12);
    }
    .ai-void-goal-ends {
        display: flex;
        justify-content: space-between;
        margin-top: -2px;
        font-size: 8.5px;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: rgba(199, 210, 254, 0.35);
        user-select: none;
    }
    .ai-void-goal-ends .end-light {
        color: rgba(253, 230, 138, 0.55);
    }
    .ai-void-todo-row.is-tomorrow {
        border-color: rgba(251, 191, 36, 0.22);
        background: rgba(251, 191, 36, 0.05);
    }
    .ai-void-tomorrow-badge {
        flex: 0 0 auto;
        font-size: 8.5px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(251, 191, 36, 0.2);
        color: #FDE68A;
        margin-inline-start: auto;
    }


    /* ---- Void Dissolve: scatter to stars + singularity toggle ---- */

    /* Dissolved menus keep their layout slot so siblings (Goals under Echo) do not jump up */
    .ai-void-is-dissolved {
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        /* keep display & dimensions — do NOT use [hidden]/display:none */
    }
    #ai-void-dissolve-layer {
        position: fixed; inset: 0; pointer-events: none; z-index: 9998;
        overflow: hidden;
    }
    .ai-void-dust {
        position: fixed;
        width: var(--sz, 3px); height: var(--sz, 3px);
        margin: calc(var(--sz, 3px) / -2) 0 0 calc(var(--sz, 3px) / -2);
        border-radius: 50%;
        background: hsl(var(--hue, 220), 90%, 78%);
        box-shadow: 0 0 8px hsl(var(--hue, 220), 100%, 70%);
        animation: voidDustOut 0.72s cubic-bezier(.2,.7,.2,1) forwards;
        pointer-events: none;
        z-index: 9999;
    }
    .ai-void-dust.is-inward {
        animation-name: voidDustIn;
        animation-duration: 0.55s;
    }
    @keyframes voidDustOut {
        0% { opacity: 1; transform: translate(0,0) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }
    @keyframes voidDustIn {
        0% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        100% { opacity: 1; transform: translate(0,0) scale(1); }
    }
    .ai-void-is-dissolving {
        animation: voidPanelOut 0.7s cubic-bezier(.4,0,.2,1) forwards !important;
        pointer-events: none !important;
    }
    .ai-void-is-reforming {
        animation: voidPanelIn 0.55s cubic-bezier(.2,.8,.2,1) forwards !important;
    }
    @keyframes voidPanelOut {
        0% { opacity: 1; filter: blur(0); transform: scale(1); }
        55% { opacity: 0.35; filter: blur(4px); transform: scale(0.92); }
        100% { opacity: 0; filter: blur(10px); transform: scale(0.78); }
    }
    @keyframes voidPanelIn {
        0% { opacity: 0; filter: blur(8px); transform: scale(0.88); }
        100% { opacity: 1; filter: blur(0); transform: scale(1); }
    }
    .ai-void-singularity {
        position: fixed;
        width: 36px; height: 36px;
        border: none; padding: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        z-index: 40;
        opacity: 0;
        transform: scale(0.4);
        transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.2,.9,.2,1);
        pointer-events: auto;
    }
    .ai-void-singularity.is-visible {
        opacity: 1;
        transform: scale(1);
    }
    .ai-void-singularity.is-collapsing {
        opacity: 0;
        transform: scale(1.6);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .ai-void-singularity-glow {
        position: absolute; inset: -6px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(129,140,248,0.35) 0%, transparent 70%);
        animation: voidSingPulse 2.8s ease-in-out infinite;
        pointer-events: none;
    }
    .ai-void-singularity-ring {
        position: absolute; inset: 2px;
        border-radius: 50%;
        border: 1px solid rgba(167, 139, 250, 0.45);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.35), inset 0 0 8px rgba(15, 10, 30, 0.8);
        animation: voidSingSpin 12s linear infinite;
        pointer-events: none;
    }
    .ai-void-singularity-core {
        position: absolute; inset: 8px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #2e1065 0%, #0a0614 55%, #000 100%);
        box-shadow: inset 0 0 6px rgba(0,0,0,0.9), 0 0 10px rgba(76, 29, 149, 0.5);
        pointer-events: none;
    }
    .ai-void-singularity-glyph {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        font-size: 11px;
        color: rgba(196, 181, 253, 0.85);
        text-shadow: 0 0 8px rgba(167, 139, 250, 0.8);
        pointer-events: none;
    }

    /* Themed singularities */
    .ai-void-singularity.theme-today .ai-void-singularity-glow {
        background: radial-gradient(circle, rgba(125, 211, 252, 0.45) 0%, transparent 70%);
    }
    .ai-void-singularity.theme-today .ai-void-singularity-ring {
        border-color: rgba(56, 189, 248, 0.55);
        box-shadow: 0 0 14px rgba(14, 165, 233, 0.4), inset 0 0 8px rgba(8, 20, 40, 0.85);
    }
    .ai-void-singularity.theme-today .ai-void-singularity-core {
        background: radial-gradient(circle at 35% 30%, #0369a1 0%, #0c1222 55%, #000 100%);
    }
    .ai-void-singularity.theme-today .ai-void-singularity-glyph { color: rgba(125, 211, 252, 0.95); text-shadow: 0 0 10px rgba(56, 189, 248, 0.9); }

    .ai-void-singularity.theme-goals .ai-void-singularity-glow {
        background: radial-gradient(circle, rgba(251, 191, 36, 0.42) 0%, transparent 70%);
    }
    .ai-void-singularity.theme-goals .ai-void-singularity-ring {
        border-color: rgba(251, 191, 36, 0.55);
        box-shadow: 0 0 14px rgba(245, 158, 11, 0.4), inset 0 0 8px rgba(30, 18, 4, 0.85);
    }
    .ai-void-singularity.theme-goals .ai-void-singularity-core {
        background: radial-gradient(circle at 35% 30%, #b45309 0%, #1c1208 55%, #000 100%);
    }
    .ai-void-singularity.theme-goals .ai-void-singularity-glyph { color: rgba(253, 230, 138, 0.95); text-shadow: 0 0 10px rgba(251, 191, 36, 0.85); }

    .ai-void-singularity.theme-echo .ai-void-singularity-glow {
        background: radial-gradient(circle, rgba(226, 232, 240, 0.4) 0%, transparent 70%);
    }
    .ai-void-singularity.theme-echo .ai-void-singularity-ring {
        border-color: rgba(203, 213, 225, 0.5);
        box-shadow: 0 0 14px rgba(148, 163, 184, 0.35), inset 0 0 8px rgba(15, 15, 25, 0.85);
    }
    .ai-void-singularity.theme-echo .ai-void-singularity-core {
        background: radial-gradient(circle at 35% 30%, #64748b 0%, #0f1218 55%, #000 100%);
    }
    .ai-void-singularity.theme-echo .ai-void-singularity-glyph { color: rgba(241, 245, 249, 0.92); text-shadow: 0 0 10px rgba(203, 213, 225, 0.75); }

    .ai-void-constellation {
        position: fixed; inset: 0; pointer-events: none; z-index: 38;
        opacity: 0; transition: opacity 0.6s ease;
    }
    .ai-void-constellation.is-visible { opacity: 1; }
    .ai-void-constellation-edge {
        stroke: rgba(199, 210, 254, 0.32);
        stroke-width: 1.15;
        stroke-linecap: round;
        filter: drop-shadow(0 0 3px rgba(129, 140, 248, 0.35));
    }
    .ai-void-helper-star {
        position: fixed;
        border-radius: 50%;
        background: radial-gradient(circle, #f8fafc 0%, #a5b4fc 45%, transparent 70%);
        box-shadow: 0 0 8px rgba(199, 210, 254, 0.55);
        pointer-events: none;
        z-index: 39;
    }
    .ai-void-constellation-caption {
        position: fixed;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        z-index: 39;
        max-width: 280px;
    }
    .ai-void-constellation-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(248, 250, 252, 0.92);
        text-shadow: 0 0 12px rgba(165, 180, 252, 0.55), 0 1px 2px rgba(0,0,0,0.5);
    }
    .ai-void-constellation-blurb {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.35;
        color: rgba(199, 210, 254, 0.72);
        text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }

    .ai-void-singularity.is-awake {
        transform: scale(1.12);
    }
    .ai-void-singularity.is-awake .ai-void-singularity-glow {
        background: radial-gradient(circle, rgba(167,139,250,0.5) 0%, transparent 70%);
    }
    .ai-void-singularity.is-awake .ai-void-singularity-ring {
        border-color: rgba(196, 181, 253, 0.7);
        animation-duration: 6s;
    }
    @keyframes voidSingPulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes voidSingSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .ai-void-dissolve-btn {
        flex: 0 0 auto;
        width: 22px; height: 22px;
        margin-inline-start: 2px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(0,0,0,0.25);
        color: rgba(196, 181, 253, 0.75);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .ai-void-dissolve-btn:hover {
        background: rgba(76, 29, 149, 0.45);
        color: #E9D5FF;
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        transform: scale(1.08);
    }
    .ai-void-dissolve-btn:active { transform: scale(0.92); }


    /* ---- Daily report bar under Today dock ---- */
    .ai-void-report-bar {
        margin-top: 4px;
        padding-top: 8px;
        border-top: 1px dashed rgba(165, 180, 252, 0.18);
        flex-shrink: 0;
    }
    .ai-void-report-row {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .ai-void-report-email {
        flex: 1 1 auto;
        min-width: 0;
        height: 28px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid rgba(165, 180, 252, 0.22);
        background: rgba(255, 255, 255, 0.05);
        color: #E8EEFF;
        font: 11.5px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
        outline: none;
        direction: ltr;
        text-align: left;
    }
    .ai-void-report-email::placeholder { color: rgba(199, 210, 254, 0.35); }
    .ai-void-report-email:focus {
        border-color: rgba(129, 140, 248, 0.55);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.18);
    }
    .ai-void-report-send,
    .ai-void-report-copy,
    .ai-void-report-txt {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid rgba(165, 180, 252, 0.22);
        background: rgba(255, 255, 255, 0.06);
        color: #C7D2FE;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s ease;
    }
    .ai-void-report-send:hover {
        background: rgba(16, 185, 129, 0.18);
        border-color: rgba(52, 211, 153, 0.45);
        color: #6EE7B7;
    }
    .ai-void-report-copy:hover {
        background: rgba(99, 102, 241, 0.18);
        border-color: rgba(129, 140, 248, 0.45);
        color: #A5B4FC;
    }
    .ai-void-report-txt:hover {
        background: rgba(251, 191, 36, 0.16);
        border-color: rgba(251, 191, 36, 0.45);
        color: #FDE68A;
    }
    .ai-void-report-send:active,
    .ai-void-report-copy:active,
    .ai-void-report-txt:active { transform: scale(0.94); }
    .ai-void-report-hint {
        margin-top: 5px;
        font-size: 10px;
        color: rgba(167, 243, 208, 0.85);
        min-height: 0;
        line-height: 1.35;
        opacity: 0;
        transition: opacity .2s ease;
    }
    .ai-void-report-hint.is-visible { opacity: 1; }
    .ai-void-report-hint.is-error { color: rgba(252, 165, 165, 0.9); }

    /* Gmail profile edit dialog */
    #ai-void-profile-dialog {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: none;
        place-items: center;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(4px);
    }
    #ai-void-profile-dialog.open { display: grid; }
    .ai-void-profile-card {
        width: min(340px, calc(100vw - 32px));
        padding: 16px;
        border-radius: 16px;
        background: rgba(16, 20, 36, 0.96);
        border: 1px solid rgba(165, 180, 252, 0.25);
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        color: #EEF2FF;
    }
    .ai-void-profile-card h3 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 700;
    }
    .ai-void-profile-card label {
        display: block;
        font-size: 11px;
        color: rgba(226,232,255,0.65);
        margin: 8px 0 4px;
    }
    .ai-void-profile-card input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid rgba(165,180,252,0.25);
        background: rgba(255,255,255,0.06);
        color: #F8FAFC;
        font: 13px system-ui, sans-serif;
        outline: none;
    }
    .ai-void-profile-card input:focus {
        border-color: rgba(165,180,252,0.55);
    }
    .ai-void-profile-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
    }
    .ai-void-profile-actions button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 0;
        font: 12px system-ui, sans-serif;
        cursor: pointer;
    }
    .ai-void-profile-save {
        background: #4f46e5;
        color: #fff;
    }
    .ai-void-profile-cancel {
        background: rgba(255,255,255,0.08);
        color: #E5E7EB;
    }
    .ai-void-profile-delete {
        margin-inline-end: auto;
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
    }

    @media (max-width: 700px) {
        /* روی موبایل، وقتی همه‌چیز (سرچ + Frequent Links + Echo + Goals)
           زیرِ هم می‌شینه، ممکنه رویِ‌همرفته از ارتفاعِ صفحه بلندتر بشه. چون
           html/body عمداً overflow:hidden هستن (برای جلوگیری از اسکرولِ کلِ
           صفحه روی starfield) و این استیج position:fixed هست (پس اسکرولِ
           سند رو دنبال نمی‌کنه)، بدونِ این قانون هر بخشی که از ویوپورت رد
           بشه (مثلِ Goals، چون آخرین آیتمه) کاملاً غیرِقابل‌دسترسی می‌موند —
           نه پنهان به‌خاطرِ منطقِ برنامه، فقط بیرون از دیدِ صفحه. */
        #ai-void-stage {
            top: max(64px, 12vh); width: calc(100vw - 24px); gap: 14px;
            max-height: calc(100vh - max(64px, 12vh) - 24px);
            overflow-y: auto; overscroll-behavior: contain;
            scrollbar-width: thin; scrollbar-color: rgba(165, 180, 252, .3) transparent;
            padding-bottom: 12px;
        }
        #ai-void-stage::-webkit-scrollbar { width: 6px; }
        #ai-void-stage::-webkit-scrollbar-track { background: transparent; }
        #ai-void-stage::-webkit-scrollbar-thumb { background: rgba(165, 180, 252, .28); border-radius: 999px; }
        #ai-void-search-brand-name { font-size: 18px; }
        #ai-void-todo-dock { top: auto !important; bottom: 16px; width: min(320px, calc(100vw - 32px)); left: 50% !important; right: auto !important; transform: translateX(-50%); }
        #ai-ntp-quickbar, #ai-ntp-quickbar[data-side="left"], #ai-ntp-quickbar[data-side="right"] {
            left: auto !important; right: 14px !important;
        }
    }
    @media (prefers-reduced-motion: reduce) {
        .ai-void-search-brand-pulse { animation: none; }
        #ai-ntp-quickbar { transition: none; }
    }
</style>
</head>

<body>

<canvas id="starfield"></canvas>
<div class="space-vignette"></div>

<div id="ai-ntp-quickbar" role="toolbar" aria-label="Page controls">
  <div id="ai-ntp-menu">
    <button type="button" id="ai-ntp-menu-btn" title="Menu" aria-haspopup="menu" aria-expanded="false">☰</button>
    <div id="ai-ntp-menu-panel" role="menu">
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-focus">
        <span>🎯 <span id="ai-ntp-menu-focus-label">Focus Mode</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-topsites" data-on="1">
        <span>🔗 <span id="ai-ntp-menu-topsites-label">Frequent Links</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-echo" data-on="1">
        <span>◌ <span id="ai-ntp-menu-echo-label">Today's Echo</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-todo" data-on="1">
        <span>◐ <span id="ai-ntp-menu-todo-label">Today Task</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-settings">
        <span>⚙️ <span id="ai-ntp-menu-settings-label">Settings</span></span>
        <span class="ai-ntp-menu-check"></span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-stdtab">
        <span>🌐 <span id="ai-ntp-menu-stdtab-label">Use Standard New Tab</span></span>
        <span class="ai-ntp-menu-check"></span>
      </button>
    </div>
  </div>
  <div id="ai-ntp-apps-wrap">
    <button type="button" id="ai-ntp-apps-btn" title="Apps" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" width="17" height="17">
        <circle cx="12" cy="12" r="4.1" fill="currentColor" stroke="none"></circle>
        <ellipse cx="12" cy="12" rx="9.6" ry="3.1" transform="rotate(-20 12 12)"></ellipse>
      </svg>
    </button>
    <div id="ai-ntp-apps-panel" role="menu" aria-label="Apps">
      <div id="ai-void-apps" aria-label="App shortcuts"></div>
    </div>
  </div>
  <a id="ai-ntp-account" href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fmyaccount.google.com%2F" target="_blank" rel="noopener" title="Switch account">◉</a>
</div>

<section id="ai-void-stage">
  <div id="ai-void-search" aria-label="Web search">
    <div class="ai-void-search-brand-row">
      <button type="button" class="ai-void-search-nav" id="ai-void-search-prev" title="Previous engine" aria-label="Previous search engine">‹</button>
      <div id="ai-void-search-brand" data-engine="google" title="Swipe or click to switch engine">
        <span class="ai-void-search-brand-mark" aria-hidden="true"></span>
        <span id="ai-void-search-brand-name">Google</span>
      </div>
      <button type="button" class="ai-void-search-nav" id="ai-void-search-next" title="Next engine" aria-label="Next search engine">›</button>
    </div>
    <form class="ai-void-search-box" id="ai-void-search-form" action="#" onsubmit="return false;">
      <svg class="ai-void-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="ai-void-search-input" name="q" autocomplete="off" spellcheck="false" dir="auto" placeholder="Search with Google…" />
      <button type="button" id="ai-void-search-go" title="Search" aria-label="Search">→</button>
    </form>
    <div id="ai-void-search-dots" role="tablist" aria-label="Search engines"></div>
  </div>

  <div id="ai-ntp-topsites"></div>

  <div id="ai-void-echo" class="is-collapsed" hidden aria-live="polite">
    <div class="ai-void-echo-handle" id="ai-void-echo-handle" role="button" tabindex="0" aria-expanded="false" title="Show / hide">
      <span class="ai-void-echo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
          <path d="M7.5 12a4.5 4.5 0 0 1 9 0"/>
          <path d="M4.5 12a7.5 7.5 0 0 1 15 0" opacity="0.65"/>
          <path d="M2 12a10 10 0 0 1 20 0" opacity="0.35"/>
        </svg>
      </span>
      <span class="ai-void-echo-title" id="ai-void-echo-title">Today's Echo</span>
      <span class="ai-void-echo-count" id="ai-void-echo-count" hidden></span>
      <span class="ai-void-echo-chevron" id="ai-void-echo-chevron" aria-hidden="true">▾</span>
      <button type="button" class="ai-void-dissolve-btn" id="ai-void-echo-dissolve" title="Dissolve into stars">◎</button>
    </div>
    <div class="ai-void-echo-content">
      <div class="ai-void-echo-body" id="ai-void-echo-body"></div>
      <div class="ai-void-echo-pattern" id="ai-void-echo-pattern" hidden></div>
    </div>
  </div>

  <!-- بخشِ Goals این‌جا زندگی می‌کنه (نه دیگه داخلِ داکِ Today) چون به‌نظرِ
       کاربر با روحِ «Today's Echo» هم‌خوان‌تره. مستقلاً hidden/visible
       می‌شه (بر اساسِ تعدادِ Goals) — به هیچ‌وجه به روشن/خاموش‌بودنِ خودِ
       Echo (که بر اساسِ فعالیتِ امروزه) وابسته نیست، وگرنه با نبودِ فعالیتِ
       امروز Goalsِ فعال هم قایم می‌شدن. id/class‌ها عمداً دست‌نخورده‌ن تا
       void-tab-todo.js بدونِ هیچ تغییری همین‌جا پیداشون کنه و رندر کنه.
  -->
  <div class="ai-void-agenda-section is-goals" id="ai-void-agenda-goals-section" hidden>
    <div class="ai-void-goals-head">
      <div class="ai-void-agenda-section-title" id="ai-void-agenda-goals-title"></div>
      <button type="button" class="ai-void-dissolve-btn" id="ai-void-goals-dissolve" title="Dissolve into stars">◎</button>
    </div>
    <div class="ai-void-todo-list ai-void-goals-list" id="ai-void-goals-list"></div>
  </div>
</section>

<aside id="ai-void-todo-dock" class="is-collapsed" data-side="left" aria-label="Today">
  <div class="ai-void-todo-head" id="ai-void-todo-handle" role="button" tabindex="0" aria-expanded="false" title="Show / hide">
    <span>◐</span><span class="ai-void-todo-title" id="ai-void-todo-title">Today</span><span class="ai-void-todo-count" id="ai-void-todo-count"></span>
    <span class="ai-void-todo-chevron" id="ai-void-todo-chevron" aria-hidden="true">▾</span>
    <button type="button" class="ai-void-dissolve-btn" id="ai-void-todo-dissolve" title="Dissolve into stars">◎</button>
    <button type="button" class="ai-void-todo-side" id="ai-void-todo-side" title="Move to other side">↔</button>
  </div>
  <div class="ai-void-agenda-body" id="ai-void-agenda-body">
    <div class="ai-void-agenda-datehead" id="ai-void-agenda-datehead"></div>
    <div class="ai-void-agenda-section">
      <div class="ai-void-agenda-section-title" id="ai-void-agenda-events-title"></div>
      <div class="ai-void-agenda-events" id="ai-void-agenda-events"></div>
    </div>
    <div class="ai-void-agenda-section">
      <div class="ai-void-agenda-section-title" id="ai-void-agenda-tasks-title"></div>
      <div class="ai-void-todo-list" id="ai-void-todo-list"></div>
    </div>
    <div class="ai-void-report-bar" id="ai-void-report-bar">
      <div class="ai-void-report-row">
        <input type="email" id="ai-void-report-email" class="ai-void-report-email" dir="ltr" autocomplete="email" spellcheck="false" maxlength="120" placeholder="you@email.com" aria-label="Email" />
        <button type="button" id="ai-void-report-send" class="ai-void-report-send" title="Email report">✉</button>
        <button type="button" id="ai-void-report-copy" class="ai-void-report-copy" title="Copy report">⎘</button>
        <button type="button" id="ai-void-report-txt" class="ai-void-report-txt" title="Download .txt">⬇</button>
      </div>
      <div class="ai-void-report-hint" id="ai-void-report-hint" aria-live="polite"></div>
    </div>
  </div>
</aside>

<div id="ai-void-profile-dialog" role="dialog" aria-modal="true" aria-labelledby="ai-void-profile-title">
  <div class="ai-void-profile-card">
    <h3 id="ai-void-profile-title">Gmail profile</h3>
    <label for="ai-void-profile-label">Label</label>
    <input id="ai-void-profile-label" type="text" maxlength="24" placeholder="Work, Personal…" autocomplete="off" />
    <label for="ai-void-profile-url">URL</label>
    <input id="ai-void-profile-url" type="url" dir="ltr" placeholder="https://mail.google.com/mail/u/0/" autocomplete="off" />
    <div class="ai-void-profile-actions">
      <button type="button" class="ai-void-profile-delete" id="ai-void-profile-delete" hidden>Delete</button>
      <button type="button" class="ai-void-profile-cancel" id="ai-void-profile-cancel">Cancel</button>
      <button type="button" class="ai-void-profile-save" id="ai-void-profile-save">Save</button>
    </div>
  </div>
</div>

<script src="void-starfield.js"></script>
<script src="void-tab-search.js"></script>
<script src="void-tab-shortcuts.js"></script>
<script src="void-tab-apps.js"></script>
<script src="void-tab-topsites.js"></script>
<script src="void-tab-account.js"></script>

<link rel="stylesheet" href="toolbar-zen.css">

<script src="calendar-engine.js"></script>
<script src="quote-engine.js"></script>
<script src="memory-engine.js"></script>
<script src="voice-engine.js"></script>
<script src="toolbar-icons.js"></script>
<script src="toolbar-dock.js"></script>
<script src="launcher-sound.js"></script>
<script src="content.js"></script>

<script src="void-dissolve.js"></script>
<script src="void-tab-menu.js"></script>
<script src="void-tab-todo.js"></script>
<script src="void-tab-memory.js"></script>

</body>
</html>
